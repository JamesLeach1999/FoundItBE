version: '3.4'
services:
  database:
    image: mysql
    container_name: mysql
    volumes:
      - db-volume:/var/lib/mysql
    ports:
      - 3307:3306
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: jadlljames
      MYSQL_PASSWORD: jadlljames
      MYSQL_USER: newuser
      MYSQL_DATABASE: users
    networks:
      - my-network

networks:
  my-network:  # Define the custom network here
    driver: bridge
volumes:
  db-volume: